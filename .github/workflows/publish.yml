name: Publish to NPM

on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "要发布的包目录名(packages/ 下,例如 auto-retry)"
        required: true
        type: string
      version:
        description: "要发布的 semver,不要加 v(例如 0.1.1 或 0.2.0-beta.1)"
        required: true
        type: string
      dry_run:
        description: "Dry run (不实际发布)"
        required: false
        default: false
        type: boolean

# 默认不含 id-token;只有 publish job 申请 OIDC
permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.target.outputs.dir }}
      version: ${{ steps.target.outputs.version }}
      prerelease: ${{ steps.target.outputs.prerelease }}
      npmTag: ${{ steps.target.outputs.npmTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit is on main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "找不到 origin/main,无法确认 ${GITHUB_SHA} 是否在主分支历史上" >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "提交 ${GITHUB_SHA} 是 origin/main 的祖先,允许继续"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::提交 ${GITHUB_SHA} 不是 origin/main 的祖先。dry run 仅警告,不阻断。"
            echo "警告: 提交 ${GITHUB_SHA} 不是 origin/main 的祖先,dry run 继续" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "拒绝发布: 提交 ${GITHUB_SHA} 不是 origin/main 的祖先。请把 tag 打在已进入 main 的提交上。" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Resolve publish target
        id: target
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 手动运行把 package 与 version 拼成 tag;版本不读 package.json
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_PACKAGE}@${INPUT_VERSION}"
          else
            tag="$REF_NAME"
          fi
          echo "正在解析发布 tag: ${tag}"
          if ! bun scripts/resolve-publish-target.ts "$tag"; then
            echo "解析发布 tag 失败: ${tag}" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use latest npm
        run: npm install -g npm@latest

      # 持有 id-token 时不安装项目依赖,避免执行依赖生命周期脚本。
      # 版本只写在本次 checkout,不提交,也不运行 npm version。
      - name: Write tag version
        env:
          DIR: ${{ needs.verify.outputs.dir }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/prepare-publish.js "$DIR" "$VERSION"

      - name: Publish to NPM
        env:
          DIR: ${{ needs.verify.outputs.dir }}
          VERSION: ${{ needs.verify.outputs.version }}
          NPM_TAG: ${{ needs.verify.outputs.npmTag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ ! "$DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "拒绝发布: 未知目录 ${DIR}" >&2
            exit 1
          fi
          cd "packages/${DIR}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== Dry Run Mode ==="
            npm pack --dry-run
          elif [ "$NPM_TAG" = "next" ]; then
            npm publish --access public --tag next
          elif [ "$NPM_TAG" = "latest" ]; then
            npm publish --access public
          else
            echo "拒绝发布: 无法识别的 npm dist-tag: ${NPM_TAG}" >&2
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          DIR: ${{ needs.verify.outputs.dir }}
          VERSION: ${{ needs.verify.outputs.version }}
          NPM_TAG: ${{ needs.verify.outputs.npmTag }}
          DRY_RUN: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 发布结果"
            if [[ "$DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] && [ -f "packages/${DIR}/package.json" ]; then
              name="$(jq -r '.name' "packages/${DIR}/package.json")"
              echo "包名: ${name}"
            fi
            if [ -n "$VERSION" ]; then
              echo "版本: ${VERSION}"
            fi
            if [ -n "$NPM_TAG" ]; then
              echo "dist-tag: ${NPM_TAG}"
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run 完成,未实际发布"
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "发布成功"
            else
              echo "发布失败"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
